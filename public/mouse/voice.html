<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5ef"><title>拾页 · 语音问答</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/voice.css"></head>
<body>
  <header><a id="home" href="/">‹ 返回首页</a><strong>拾页 · 语音问答</strong><span id="engine"></span></header>
  <main>
    <form id="pairForm" hidden><label for="pair">配对码</label><input id="pair" autocomplete="off" placeholder="电脑终端显示的配对码"><button>连接</button></form>
    <section id="recordPanel" aria-label="录音控制">
      <p class="eyebrow">用声音提问</p><h1>左键开始 · 右键结束</h1>
      <p class="hint">点击页面空白处开始录音。右键结束后，自动转写问题并给出答案与解析。</p>
      <div id="indicator"><i></i><span id="status" role="status" aria-live="polite">正在连接…</span><time id="timer">00:00</time></div>
      <div class="controls"><button id="start" class="primary" disabled>开始录音</button><button id="stop" disabled>结束并回答</button><button id="cancel" disabled>取消</button></div>
      <p class="hint">每次最多 5 分钟，到时自动结束并提交。录音时请保持页面在前台。</p>
    </section>
    <section id="questionPanel" hidden><h2>识别到的问题</h2><p id="question"></p></section>
    <section id="answerPanel" hidden><h2>答案与解析</h2><div id="answer"></div></section>
    <p class="hint">录音结束后发送至 OpenAI 转写；解答沿用首页选中的模型和任务背景。原始录音不保存到解析端磁盘，本页结果刷新后清除。</p>
  </main>
  <script type="module" src="/voice.js"></script>
</body></html>
